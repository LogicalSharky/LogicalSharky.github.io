<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantpicker</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button id="menuToggle" class="menu-toggle">&#9776;</button>

  <div class="sidebar">
    <input type="text" id="searchBar" placeholder="Search plants...">
    <div id="tagFilters" class="tag-filters"></div>
  </div>

  <div class="main-content">
    <div id="gallery" class="gallery"></div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <div class="overlay-image">
        <img id="overlayImg" src="" alt="">
      </div>
      <div class="overlay-box">
        <button class="close-btn">&times;</button>
        <div class="overlay-details"></div>

        <div class="thumbnail-navigation">
          <button id="prevArrow" class="arrow-btn">&lt;</button>
          <div class="thumbnail-row" id="thumbnailRow"></div>
          <button id="nextArrow" class="arrow-btn">&gt;</button>
        </div>
      </div>
    </div>
  </div>

  <script src="images.js"></script>
  <script src="script.js"></script>
</body>
</html>
