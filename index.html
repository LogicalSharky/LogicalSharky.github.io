<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantpicker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #d4fc79, #96e6a1);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: 0;
    }

    h1 {
      color: #2e4e1e;
      margin-bottom: 40px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }

    .button-container {
      display: flex;
      gap: 20px;
    }

    a {
      text-decoration: none;
    }

    .button {
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .button:hover {
      background-color: #45a049;
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
    }

  </style>
</head>
<body>
  <h1>Welcome to Plantpicker by Mats Pinket</h1>

  <div class="button-container">
    <a href="plantpicker old/index.html" class="button">Visit the old working version of Plantpicker</a>
    <a href="plantpicker/index.html" class="button">Visit the new unfinished version of Plantpicker</a>
  </div>

</body>
</html>
