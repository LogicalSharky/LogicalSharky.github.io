<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenscape by Mats Pinket</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">  
  <style>

    body {
      background: url("Background.jpeg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #3c5353;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 40px;
      padding: 0 10%;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80%;
      max-width: 600px;
      gap: 20px;
    }

    .button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px 25px;
      background-color: #3c5353;
      color: white;
      text-decoration: none;
      font-size: 1.1em;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .button:hover {
      background-color: #aa7748;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .button-container {
        width: 80%;
        padding: 0 10%;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to Greenscape by Mats Pinket</h1>
  <div class="button-container">
    <a href="Plant database old/index.html" class="button">Old working database</a>
    <a href="Plant database/index.html" class="button">Plant database (unfinished)</a>
    <a href="Houseplant database/index.html" class="button">Houseplant database (unfinished)</a>
  </div>
</body>
</html>
